<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 7 - Activity Notifications</title>
    <link rel="stylesheet" href="style.css"> 
  </head>

  <body>

    <!-- default test users for grading: admin/admin123 and author/author123 -->

    <div class="container">
      <h1>Assignment 7 - Activity Notifications</h1>

      <div id="sseStatus" class="sse-status connecting">Connecting to live updates…</div>

      <h2>Login</h2>
      <input id="loginUsername" placeholder="Username">
      <input id="loginPassword" type="password" placeholder="Password">
      <button onclick="testLogin()">Login</button>
      <p id="loginStatus"></p>
      <p class="hint">create, update, and delete require login. Delete requires admin role.</p>

      <h2>Items <span class="hint">(updates live for all connected users)</span></h2>
      <div id="items"></div>

      <h2>Add Item</h2>
      <input id="name" placeholder="Item name">
      <button onclick="addItem()">Add Item</button>

      <h2>Update Item</h2>
      <input id="updateId" placeholder="Item ID">
      <input id="updateName" placeholder="New name">
      <button onclick="updateItem()">Update Item</button>

      <h2>Delete Item</h2>
      <input id="deleteId" placeholder="Item ID">
      <button onclick="deleteItem()">Delete Item</button>

      <h2>Create User (Admin Only)</h2>
      <input id="newUsername" placeholder="New Username">
      <input id="newPassword" placeholder="New Password">
      <select id="role">
        <option value="author">Author</option>
        <option value="admin">Admin</option>
      </select>
      <button onclick="createUser()">Create User</button>
      <p id="userStatus"></p>

    </div>

    <script src="script.js"></script>

  </body>
</html>
