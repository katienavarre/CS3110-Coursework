<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1 - Self Mutilating Page</title>
    <link rel="stylesheet" href="Assignment1.css">
</head>

<body>

    <header>
        <h1>My Interactive Self-Mutilating Page</h1>
    </header>

    <main>
        <div>
            <p id="introText">Click the button below to see the magic happen!</p>

            <button id="deleteButton" type="button">Remove Intro Text</button>
            <button id="addButton" type="button">Add New Message</button>
        </div>

        <div>
            <form id="messageForm">
                <label for="UserInput">Enter a new message:</label>
                <input type="text" id="UserInput" name="UserInput">
                <button type="submit" id="submitButton">Submit</button>
            </form>
        </div>

        <div id="messageArea"></div>
    </main>

    <script src="Assignment1.js"></script>

</body>
</html>
