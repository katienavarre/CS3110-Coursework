<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment 3 API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div class="container">
        <h1>Simple CRUD API</h1>

        <h2>GET All Items</h2>
        <a href="/api/items">View All Items</a>

        <h2>POST New Item</h2>
        <form action="/api/items" method="POST">
                <input type="text" name="name" placeholder="Enter item name" required>
                <button type="submit">Add Item</button>
        </form>

        <h2>Manual GET by ID</h2>
        <a href="/api/items?id=1">Get Item</a>

        <h3>Manual DELETE by ID</h3>

        <form action="/delete-item" method="POST">
                <input type="number" name="id" placeholder="Enter item ID" required>
                <button type="submit">Delete Item</button>
        </form>
        </div>
</body>
</html>
